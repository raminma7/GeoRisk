[project]
name = "georisk"
version = "0.1.0"
description = "GeoRisk — global geopolitical, conflict and (future) economic intelligence platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "structlog>=24.4",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "httpx>=0.27",
  "tenacity>=9.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "slowapi>=0.1.9",
  "python-multipart>=0.0.9",
  "anthropic>=0.40",
  "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.registry" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: tests that call real external services (opt-in with GEORISK_LIVE_TESTS=1)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
