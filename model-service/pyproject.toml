[project]
name = "georisk-model-service"
version = "0.1.0"
description = "Stand-alone prediction service for GeoRisk ML model packages (no dependency on the GeoRisk app)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "lightgbm>=4.5", "numpy>=1.26", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "scikit-learn>=1.5", "pandas>=2.2"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["model_service*"]
